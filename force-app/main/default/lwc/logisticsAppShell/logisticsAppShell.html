<template>
  <div class={shellContainerClass}>
    <!-- Left Application Sidebar -->
    <aside class={sidebarClass} aria-label="Application Navigation">
      <div class="sidebar-header">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-pulse"></span>
          </div>
          <div class="brand-text">
            <p class="brand-title">LOGISTICS INTELLIGENCE</p>
            <p class="brand-tagline">Monitor. Predict. Investigate. Resolve.</p>
          </div>
        </div>
      </div>

      <nav class="nav-menu" aria-label="Workspaces">
        <template for:each={workspaces} for:item="ws">
          <button
            key={ws.id}
            type="button"
            class={ws.buttonClass}
            data-workspace={ws.id}
            aria-current={ws.ariaCurrent}
            onclick={handleNavClick}
          >
            <span class="nav-icon-wrap" aria-hidden="true">
              <lightning-icon
                icon-name={ws.icon}
                size="x-small"
                class={ws.iconClass}
              ></lightning-icon>
            </span>
            <span class="nav-label-group">
              <span class="nav-label">{ws.label}</span>
            </span>
          </button>
        </template>
      </nav>

      <div class="sidebar-footer">
        <button
          type="button"
          class="btn-collapse"
          data-action="toggle-sidebar"
          aria-label={collapseToggleLabel}
          onclick={handleToggleSidebar}
        >
          <lightning-icon
            icon-name={collapseIcon}
            size="x-small"
          ></lightning-icon>
          <span class="collapse-label">{collapseActionText}</span>
        </button>
      </div>
    </aside>

    <!-- Mobile Drawer Backdrop -->
    <template lwc:if={isMobileNavOpen}>
      <div
        class="mobile-backdrop"
        onclick={handleCloseMobileNav}
        aria-hidden="true"
      ></div>
    </template>

    <!-- Main Viewport (Top Navigation + Workspace Canvas) -->
    <div class="viewport">
      <!-- Top Navigation Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="btn-mobile-menu"
            data-action="toggle-mobile-nav"
            aria-label="Toggle navigation menu"
            onclick={handleToggleMobileNav}
          >
            <lightning-icon
              icon-name="utility:rows"
              size="small"
            ></lightning-icon>
          </button>
          <div class="workspace-breadcrumb">
            <span class="app-eyebrow">Logistics Intelligence</span>
            <h1 class="workspace-heading">{currentWorkspace.label}</h1>
            <p class="workspace-summary">{currentWorkspace.description}</p>
          </div>
        </div>

        <div class="topbar-center">
          <div class="global-search-wrapper">
            <lightning-input
              class="global-search-input"
              type="search"
              label="Global shipment search"
              variant="label-hidden"
              placeholder="Search shipments (tracking code or carrier)..."
              value={globalSearchInput}
              data-element="global-search"
              onchange={handleGlobalSearchChange}
            ></lightning-input>
          </div>
        </div>

        <div class="topbar-right">
          <div
            class="status-indicator-badge"
            title="Shippo carrier integration in test mode"
            data-indicator="shell-test-status"
          >
            <span class="status-dot"></span>
            <span class="status-text">Shippo Test Mode</span>
          </div>

          <button
            type="button"
            class="btn-topbar-refresh"
            data-action="global-refresh"
            title="Refresh shipment data"
            onclick={handleGlobalRefresh}
          >
            <lightning-icon
              icon-name="utility:refresh"
              size="x-small"
            ></lightning-icon>
            <span class="refresh-label">Refresh</span>
          </button>
        </div>
      </header>

      <!-- Workspace Body Area -->
      <main class="content-canvas" role="main">
        <!-- Control Tower Workspace (Embeds existing Shipment Dashboard) -->
        <template lwc:if={isControlTowerActive}>
          <div class="workspace-container" data-view="control-tower">
            <c-shipment-dashboard
              external-search-term={globalSearchTerm}
            ></c-shipment-dashboard>
          </div>
        </template>

        <!-- Shipment Intelligence Workspace -->
        <template lwc:elseif={isShipmentIntelligenceActive}>
          <div class="workspace-container" data-view="shipment-intelligence">
            <c-shipment-intelligence
              external-search-term={globalSearchTerm}
            ></c-shipment-intelligence>
          </div>
        </template>

        <!-- Risk Intelligence Workspace -->
        <template lwc:elseif={isRiskIntelligenceActive}>
          <div class="workspace-container" data-view="risk-intelligence">
            <c-risk-intelligence
              external-search-term={globalSearchTerm}
            ></c-risk-intelligence>
          </div>
        </template>

        <!-- Exception Centre Workspace -->
        <template lwc:elseif={isExceptionCentreActive}>
          <div class="workspace-container" data-view="exception-centre">
            <c-exception-centre
              external-search-term={globalSearchTerm}
            ></c-exception-centre>
          </div>
        </template>

        <!-- Analytics & Reports Workspace -->
        <template lwc:elseif={isAnalyticsReportsActive}>
          <div class="workspace-container" data-view="analytics-reports">
            <c-analytics-reports
              external-search-term={globalSearchTerm}
            ></c-analytics-reports>
          </div>
        </template>

        <!-- Case Management Workspace -->
        <template lwc:elseif={isCaseManagementActive}>
          <div class="workspace-container" data-view="case-management">
            <c-case-management
              external-search-term={globalSearchTerm}
            ></c-case-management>
          </div>
        </template>
      </main>
    </div>
  </div>
</template>
