<template>
  <div class={shellContainerClass}>
    <!-- Left Application Sidebar -->
    <aside class={sidebarClass} aria-label="Application Navigation">
      <div class="sidebar-header">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-pulse"></span>
          </div>
          <div class="brand-text">
            <p class="brand-title">LOGISTICS INTELLIGENCE</p>
            <p class="brand-tagline">Monitor • Predict • Resolve</p>
          </div>
        </div>
      </div>

      <nav class="nav-menu" aria-label="Workspaces">
        <template for:each={workspaces} for:item="ws">
          <button
            key={ws.id}
            type="button"
            class={ws.buttonClass}
            data-workspace={ws.id}
            aria-current={ws.ariaCurrent}
            onclick={handleNavClick}
          >
            <span class="nav-icon-wrap" aria-hidden="true">
              <lightning-icon
                icon-name={ws.icon}
                size="x-small"
                class={ws.iconClass}
              ></lightning-icon>
            </span>
            <span class="nav-label-group">
              <span class="nav-label">{ws.label}</span>
              <template lwc:if={ws.isComingSoon}>
                <span class="badge-coming-soon">Coming Soon</span>
              </template>
            </span>
          </button>
        </template>
      </nav>

      <div class="sidebar-footer">
        <button
          type="button"
          class="btn-collapse"
          data-action="toggle-sidebar"
          aria-label={collapseToggleLabel}
          onclick={handleToggleSidebar}
        >
          <lightning-icon
            icon-name={collapseIcon}
            size="x-small"
          ></lightning-icon>
          <span class="collapse-label">{collapseActionText}</span>
        </button>
      </div>
    </aside>

    <!-- Mobile Drawer Backdrop -->
    <template lwc:if={isMobileNavOpen}>
      <div
        class="mobile-backdrop"
        onclick={handleCloseMobileNav}
        aria-hidden="true"
      ></div>
    </template>

    <!-- Main Viewport (Top Navigation + Workspace Canvas) -->
    <div class="viewport">
      <!-- Top Navigation Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="btn-mobile-menu"
            data-action="toggle-mobile-nav"
            aria-label="Toggle navigation menu"
            onclick={handleToggleMobileNav}
          >
            <lightning-icon
              icon-name="utility:rows"
              size="small"
            ></lightning-icon>
          </button>
          <div class="workspace-breadcrumb">
            <span class="app-eyebrow">Workspace</span>
            <h1 class="workspace-heading">{currentWorkspace.label}</h1>
          </div>
        </div>

        <div class="topbar-center">
          <div class="global-search-wrapper">
            <lightning-input
              class="global-search-input"
              type="search"
              label="Global shipment search"
              variant="label-hidden"
              placeholder="Search shipments (tracking code or carrier)..."
              value={globalSearchInput}
              data-element="global-search"
              onchange={handleGlobalSearchChange}
            ></lightning-input>
          </div>
        </div>

        <div class="topbar-right">
          <div
            class="status-indicator-badge"
            title="Shippo carrier integration in test mode"
            data-indicator="shell-test-status"
          >
            <span class="status-dot"></span>
            <span class="status-text">Shippo Test Mode</span>
          </div>

          <button
            type="button"
            class="btn-topbar-refresh"
            data-action="global-refresh"
            title="Refresh shipment data"
            onclick={handleGlobalRefresh}
          >
            <lightning-icon
              icon-name="utility:refresh"
              size="x-small"
            ></lightning-icon>
            <span class="refresh-label">Refresh</span>
          </button>
        </div>
      </header>

      <!-- Workspace Body Area -->
      <main class="content-canvas" role="main">
        <!-- Control Tower Workspace (Embeds existing Shipment Dashboard) -->
        <template lwc:if={isControlTowerActive}>
          <div class="workspace-container" data-view="control-tower">
            <c-shipment-dashboard
              external-search-term={globalSearchTerm}
            ></c-shipment-dashboard>
          </div>
        </template>

        <!-- Coming Soon Placeholder Workspace -->
        <template lwc:else>
          <div
            class="coming-soon-container"
            data-view={currentWorkspace.id}
            role="region"
            aria-label={currentWorkspace.label}
          >
            <article class="coming-soon-card">
              <div class="coming-soon-icon-box" aria-hidden="true">
                <lightning-icon
                  icon-name={currentWorkspace.icon}
                  size="medium"
                ></lightning-icon>
              </div>

              <div class="coming-soon-badge-row">
                <span class="badge-coming-soon-large">Coming Soon</span>
                <span class="badge-roadmap">Phase 2 Destination</span>
              </div>

              <h2 class="coming-soon-title">{currentWorkspace.label}</h2>
              <p class="coming-soon-desc">{currentWorkspace.description}</p>

              <div class="coming-soon-divider"></div>

              <p class="coming-soon-note">
                This workspace is planned for the next release. Real-time
                telemetry, predictive modeling, and dedicated triage tools are
                currently in architecture review.
              </p>

              <button
                type="button"
                class="btn-return"
                data-action="return-control-tower"
                onclick={handleReturnToControlTower}
              >
                <lightning-icon
                  icon-name="utility:back"
                  size="x-small"
                ></lightning-icon>
                <span>Return to Control Tower</span>
              </button>
            </article>
          </div>
        </template>
      </main>
    </div>
  </div>
</template>
